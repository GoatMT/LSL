<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Lantern Soccer League pulse page with the latest champions, leaders, awards, and league notes.">
    <meta name="theme-color" content="#113c1f">
    <title>Lantern Soccer League | LSL Pulse</title>
    <link rel="icon" href="./Logos/lsl-logo.png">
    <link rel="stylesheet" href="./css/main.css?v=3.9">
    <link rel="stylesheet" href="./css/components.css?v=3.9">
    <link rel="stylesheet" href="./css/responsive.css?v=3.9">
    <style>
      .pulse-tabs {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .pulse-tabs button,
      .pulse-post-actions button {
        border: 1px solid rgba(199, 163, 103, 0.45);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        border-radius: 14px;
        padding: 13px 16px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      .pulse-tabs button.active {
        background: #113c1f;
        border-color: #c7a367;
      }

      .pulse-name-row,
      .pulse-account-top,
      .pulse-account-form,
      .pulse-composer-actions,
      .pulse-post-actions,
      .pulse-reply-form {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .pulse-name-row input,
      .pulse-account-form input,
      .pulse-composer textarea,
      .pulse-reply-form input {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #fff;
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
      }

      .pulse-account-panel {
        display: grid;
        gap: 16px;
      }

      .pulse-account-top {
        justify-content: space-between;
      }

      .pulse-account-button {
        width: 58px;
        height: 58px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid #c7a367;
        background: #113c1f;
        color: #fff;
        border-radius: 18px;
        font: inherit;
        font-weight: 950;
        cursor: pointer;
      }

      .pulse-account-top h2,
      .pulse-account-top p {
        margin: 0;
      }

      .pulse-account-top > div {
        min-width: 0;
        flex: 1;
      }

      .pulse-account-form {
        padding: 14px;
        border: 1px solid rgba(199, 163, 103, 0.22);
        background: rgba(255, 255, 255, 0.04);
        border-radius: 16px;
      }

      .pulse-account-form small {
        color: rgba(255, 255, 255, 0.72);
        min-width: 180px;
      }

      .pulse-composer textarea {
        min-height: 120px;
        resize: vertical;
      }

      .pulse-composer-actions {
        justify-content: space-between;
        margin-top: 12px;
      }

      .pulse-feed {
        display: grid;
        gap: 16px;
      }

      .pulse-post-card {
        border: 1px solid rgba(199, 163, 103, 0.22);
        background: rgba(255, 255, 255, 0.045);
        border-radius: 18px;
        padding: 18px;
      }

      .pulse-post-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
      }

      .pulse-avatar {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #113c1f;
        border: 1px solid #c7a367;
        color: #fff;
        font-weight: 900;
      }

      .pulse-post-head p,
      .pulse-source,
      .pulse-reply small,
      .pulse-composer-actions small {
        color: rgba(255, 255, 255, 0.72);
      }

      .pulse-post-body {
        line-height: 1.65;
      }

      .pulse-post-actions {
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        margin-top: 16px;
        padding-top: 14px;
      }

      .pulse-post-actions button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .pulse-post-actions button.liked {
        background: #113c1f;
        border-color: #c7a367;
        color: #fff;
      }

      .pulse-replies {
        display: grid;
        gap: 10px;
        margin-top: 14px;
      }

      .pulse-reply {
        border-left: 3px solid #c7a367;
        background: rgba(17, 60, 31, 0.35);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .pulse-reply-form {
        margin-top: 14px;
      }

      @media (max-width: 720px) {
        .pulse-tabs,
        .pulse-name-row,
        .pulse-account-top,
        .pulse-account-form,
        .pulse-composer-actions,
        .pulse-reply-form {
          grid-template-columns: 1fr;
          flex-direction: column;
          align-items: stretch;
        }

        .pulse-account-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body data-disable-animations>
    <div id="site-navbar"></div>
    <main id="page-root" class="page-shell"></main>
    <div id="site-footer"></div>
    <script type="module" src="./js/lslPulse.js?v=1.1"></script>
  </body>
</html>
